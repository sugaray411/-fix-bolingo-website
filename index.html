    <meta property="og:title" content="Fix Bolingo International Limited | Maritime &amp; Industrial Services" />

    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />
    <script>
      // Preload each route's hero (LCP) image before the app bundle runs.
      // Keep in sync with the hero image used by each page.
      (function () {
        // [image name, available widths] — must match src/data/image-meta.json
        var heroes = {
          "/about": ["zoomlion-crane-2", [480, 713]],
          "/services": ["dismantling-site-1", [480, 800, 1040]],
          "/projects": ["dismantling-site-3", [480, 800, 1040]],
          "/contact": ["barge-waterfront", [480, 800, 1020]]
        };
        var path = location.pathname.replace(/\/$/, "") || "/";
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.fetchPriority = "high";
        if (path === "/") {
          // Home opens on the hero video; preload its poster frame
          l.href = "videos/hero-poster.webp";
          document.head.appendChild(l);
          return;
        }
        var hero = heroes[path];
        if (!hero) return;
        var name = hero[0], widths = hero[1];
        l.type = "image/webp";
        l.href = "images/" + name + "-" + widths[widths.length - 1] + ".webp";
        l.imageSrcset = widths.map(function (w) { return "images/" + name + "-" + w + ".webp " + w + "w"; }).join(", ");
        l.imageSizes = "100vw";
        document.head.appendChild(l);
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Fix Bolingo International Limited",
        "description": "Maritime and industrial services: ship scrapping, marine cutting, jetty support, heavy-equipment coordination, water supply and general contracting.",
        "telephone": "+2347065906404",
        "email": "fixbolingointernational31@yahoo.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Kirikiri Waterside",
          "addressLocality": "Apapa, Lagos",
          "addressCountry": "NG"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Fix Bolingo International Limited, Kirikiri Waterside, Apapa, Lagos. Phone +234 706 590 6404.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
